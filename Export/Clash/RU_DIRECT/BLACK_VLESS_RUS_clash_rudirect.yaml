  servername: "\x76\x32\x72\x61\x79\x2e\x61\x69\x7a\x67\x6c\x2e\x63\x6f\x6d"
  client-fingerprint: safari
  network: ws
  ws-opts:
    path: /xray-ws
    headers:
      Host: v2ray.aizgl.com

proxy-groups:
  - name: "Igareck Auto Select (Автоподключение)"
    type: url-test
    include-all: true
    exclude-type: "Direct|Reject|RejectDrop|Compatible|Pass|Dns"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 150
    lazy: true
    timeout: 5000
    max-failed-times: 2
    expected-status: 204

  - name: "Igareck Manual (Ручное Подключение)"
    type: select
    proxies:
      - "Igareck Auto Select (Автоподключение)"
    include-all: true
    exclude-type: "Direct|Reject|RejectDrop|Compatible|Pass|Dns"
    default-selected: "Igareck Auto Select (Автоподключение)"

  - name: "GLOBAL"
    type: select
    proxies:
      - "Igareck Auto Select (Автоподключение)"
      - "Igareck Manual (Ручное Подключение)"
    default-selected: "Igareck Auto Select (Автоподключение)"

rules:
  - DOMAIN-SUFFIX,localhost,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
  - "DOMAIN-REGEX,^[^.]+$,DIRECT"

  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve

  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve

  - DOMAIN-SUFFIX,ru,DIRECT
  - DOMAIN-SUFFIX,xn--p1ai,DIRECT
  - GEOSITE,category-ru,DIRECT
  - GEOIP,RU,DIRECT

  - "MATCH,Igareck Manual (Ручное Подключение)"
